name: Feature request
description: Suggest an improvement to Blabee or its public integrations.
body:
  - type: textarea
    id: problem
    attributes:
      label: What gets in your way?
      description: Describe your workflow and the outcome you want.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Suggested improvement
      description: Include alternatives you have tried, if any.
