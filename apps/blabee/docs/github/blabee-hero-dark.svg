<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title description">
  <title id="title">Blabee — Your agents. One place to decide.</title>
  <desc id="description">Product illustration using the Blabee menu-bar mark. A compact macOS panel offers Review the changes or Run the checks, with option-key shortcuts and Skip Choices. Codex and Claude Code share the same inbox.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#2B3A40"/><stop offset="1" stop-color="#233139"/></linearGradient>
    <radialGradient id="warm"><stop stop-color="#725D35" stop-opacity=".7"/><stop offset="1" stop-color="#725D35" stop-opacity="0"/></radialGradient>
    <radialGradient id="cool"><stop stop-color="#2A6279" stop-opacity=".75"/><stop offset="1" stop-color="#2A6279" stop-opacity="0"/></radialGradient>
    <filter id="shadow" x="-20%" y="-15%" width="140%" height="150%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#071B25" flood-opacity=".26"/></filter>
    <g id="bee"><path d="M13.1 16.1C6.1 15.5 2.6 6.3 5.3 3.2C8.4-.2 15.1 8.9 13.1 16.1Z"/><path d="M15 16.1C16.2 9.9 23.8 5.4 26.3 8.1C29 11.4 21.7 17.1 15 16.1Z"/><path d="M12 18H20Q21 19 21.1 20.7H10.9Q11 19 12 18Z"/><path d="M10.7 22.2H21.3V24.4H10.7Z"/><path d="M11.2 25.9H20.8C20 28.5 18.4 29.4 16 29.4C13.6 29.4 12 28.5 11.2 25.9Z"/></g>
    <style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.mono{font-family:Menlo,Consolas,monospace}</style>
  </defs>
  <rect width="1280" height="640" rx="28" fill="#111C21"/>
  <ellipse cx="1160" cy="540" rx="460" ry="350" fill="url(#warm)"/>
  <ellipse cx="762" cy="560" rx="420" ry="370" fill="url(#cool)"/>
  <path d="M665 44V596" stroke="#34474E" stroke-dasharray="3 9" stroke-opacity=".6"/>
  <use href="#bee" transform="translate(51 44) scale(1.65)" fill="#EDF3F4"/>
  <text x="112" y="90" font-size="35" font-weight="700" letter-spacing="-1" fill="#EDF3F4">blabee</text>
  <text x="64" y="164" font-size="12" font-weight="700" letter-spacing="2.4" fill="#A9BCC5">A COMPANION FOR YOUR CODING FLOW</text>
  <g font-size="67" font-weight="700" letter-spacing="-2.8" fill="#EDF3F4">
    <text x="61" y="253">Your agents.</text>
    <text x="61" y="329">One place</text>
    <text x="61" y="405">to decide.</text>
  </g>
  <text x="64" y="461" font-size="21" fill="#A9BCC5">Choose a next step.</text>
  <text x="64" y="491" font-size="21" fill="#A9BCC5">Continue in the original session.</text>
  <g transform="translate(64 546)">
    <rect width="95" height="34" rx="17" fill="#1E3038" stroke="#34474E"/>
    <rect x="106" width="151" height="34" rx="17" fill="#1E3038" stroke="#34474E"/>
    <text x="47.5" y="23" text-anchor="middle" font-size="14" font-weight="600" fill="#EDF3F4">Codex</text>
    <text x="181.5" y="23" text-anchor="middle" font-size="14" font-weight="600" fill="#EDF3F4">Claude Code</text>
    <text x="281" y="23" font-size="13" fill="#A9BCC5">Built for macOS</text>
  </g>
