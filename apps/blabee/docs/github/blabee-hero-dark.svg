  <text class="mono" x="1158" y="446" text-anchor="middle" font-size="15" fill="#EDF3F4">⌥2</text>
  <rect x="738" y="513" width="151" height="41" rx="20.5" fill="#354C58" fill-opacity=".35" stroke="#5D737B" stroke-width="1.5"/>
  <rect x="901" y="513" width="201" height="41" rx="20.5" fill="#344047" fill-opacity=".25" stroke="#34474E"/>
  <path d="m756 527 8 6-8 6zM768 527v12" fill="none" stroke="#EDF3F4" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="779" y="538" font-size="13" font-weight="600" fill="#EDF3F4">Skip Choices</text>
  <text x="1001.5" y="538" text-anchor="middle" font-size="13" font-weight="600" fill="#A9BCC5" opacity=".7">↶ Previous Prompt</text>
</svg>
