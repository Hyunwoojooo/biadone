  <text x="1137" y="145" text-anchor="middle" font-size="12" font-weight="600" fill="#EDF3F4">↗ Show Details</text>
  <text x="738" y="193" font-size="24" font-weight="600" letter-spacing="-.5" fill="#EDF3F4">Changes are ready.</text>
  <text x="738" y="225" font-size="24" font-weight="600" letter-spacing="-.5" fill="#EDF3F4">Choose what happens next.</text>
  <rect x="738" y="251" width="222" height="224" rx="22" fill="#354C58" stroke="#5D737B" stroke-width="1.5"/>
  <rect x="971" y="251" width="222" height="224" rx="22" fill="#344047" stroke="#5D737B" stroke-width="1.5"/>
  <g font-size="21" font-weight="650" letter-spacing="-.4" fill="#EDF3F4">
    <text x="757" y="287">Review the</text><text x="757" y="315">changes</text>
    <text x="990" y="287">Run the</text><text x="990" y="315">checks</text>
  </g>
  <rect x="757" y="336" width="116" height="26" rx="13" fill="#415B67" fill-opacity=".6" stroke="#AAC5D2" stroke-opacity=".25"/>
  <text x="815" y="354" text-anchor="middle" font-size="12" font-weight="600" fill="#AAC5D2">Recommended</text>
  <rect x="907" y="425" width="36" height="31" rx="15.5" fill="#1E3038"/>
