<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="blabase 실행 계획 대시보드의 목적과 정보를 유지한 세 가지 디자인 프로토타입"
    />
    <title>blabase · Execution Dashboard Prototypes</title>
    <style>
      :root {
        color-scheme: dark;
        --green: #59e391;
        --blue: #6ba8ff;
        --violet: #b394ff;
        --amber: #f4b95e;
        --rose: #f18498;
        --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
        --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
        font-family: Inter, Pretendard, "Noto Sans KR", -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-width: 320px;
        min-height: 100%;
        margin: 0;
      }

      button,
      a,
      summary {
        -webkit-tap-highlight-color: transparent;
      }

      button:focus-visible,
      a:focus-visible,
      summary:focus-visible {
        outline: 2px solid var(--blue);
        outline-offset: 3px;
      }

      #stage {
        min-height: 100vh;
      }

      .prototype-note {
        font-family: "SFMono-Regular", Consolas, monospace;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.13em;
        text-transform: uppercase;
      }

      .status-dot {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-family: "SFMono-Regular", Consolas, monospace;
        font-size: 9px;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .status-dot::before {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: currentColor;
        content: "";
      }

      .status-dot[data-status="verified"] { color: var(--green); }
      .status-dot[data-status="local"] { color: var(--blue); }
      .status-dot[data-status="shadow"] { color: var(--violet); }
      .status-dot[data-status="partial"] { color: var(--amber); }
      .status-dot[data-status="planned"] { color: #a8afb9; }
      .status-dot[data-status="gate"] { color: var(--rose); }

      .pressable {
        transform: scale(1);
        transition: transform 140ms var(--ease-out);
      }

      .pressable:active {
        transform: scale(0.97);
      }

      /* Command — dense operating surface */
      .command {
        min-height: 100vh;
        padding: 0 0 110px;
        background:
          linear-gradient(rgba(255, 255, 255, 0.018) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.018) 1px, transparent 1px),
          #090b0e;
        background-size: 40px 40px;
        color: #f0eee9;
      }

      .command-shell {
        width: min(1440px, calc(100% - 40px));
        margin: 0 auto;
      }

      .command-header {
        position: sticky;
        top: 0;
        z-index: 20;
        display: flex;
        min-height: 62px;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        border-bottom: 1px solid #282e38;
        background: rgba(9, 11, 14, 0.88);
        backdrop-filter: blur(16px);
      }

      .command-brand {
        display: flex;
        align-items: center;
        gap: 11px;
        font-size: 13px;
        font-weight: 750;
      }

      .command-brand::before {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--green);
        box-shadow: 0 0 16px rgba(89, 227, 145, 0.66);
        content: "";
      }

      .command-filter {
        display: flex;
        gap: 4px;
      }

      .command-filter button {
        min-height: 30px;
        padding: 0 12px;
        border: 1px solid #303744;
        border-radius: 8px;
        background: #11151a;
        color: #929aa7;
        cursor: pointer;
        font: 650 10px/1 inherit;
      }

      .command-filter button[aria-pressed="true"] {
        border-color: #dce1e8;
        background: #e9edf2;
        color: #111318;
      }

      .command-hero {
        display: grid;
        grid-template-columns: minmax(0, 1.2fr) minmax(340px, 0.8fr);
        gap: 36px;
        padding: 68px 0 36px;
        border-bottom: 1px solid #2b313b;
      }

      .command-hero h1 {
        max-width: 870px;
        margin: 12px 0 18px;
        font-size: clamp(48px, 6vw, 88px);
        letter-spacing: -0.065em;
        line-height: 0.96;
      }

      .command-hero p {
        max-width: 760px;
        margin: 0;
        color: #abb2bd;
        font-size: 16px;
        line-height: 1.6;
      }

      .frontier-stack {
        display: grid;
        gap: 8px;
        align-content: end;
      }

      .frontier-row {
        display: grid;
        grid-template-columns: 90px minmax(0, 1fr) auto;
        gap: 14px;
        align-items: center;
        min-height: 52px;
        padding: 0 15px;
        border: 1px solid #303744;
        border-radius: 10px;
        background: #11151a;
      }

      .frontier-row span:first-child {
        color: #707987;
        font: 700 9px/1 "SFMono-Regular", Consolas, monospace;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      .frontier-row strong {
        font-size: 12px;
      }

      .command-section {
        padding: 38px 0 0;
      }

      .command-titlebar {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 22px;
        margin-bottom: 15px;
      }

      .command-titlebar h2 {
        margin: 5px 0 0;
        font-size: 30px;
        letter-spacing: -0.045em;
      }

      .command-titlebar p {
        max-width: 620px;
        margin: 0;
        color: #858e9b;
        font-size: 11px;
        text-align: right;
      }

      .command-matrix {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        overflow: hidden;
        border: 1px solid #303744;
        border-radius: 14px;
        background: #101318;
      }

      .command-card {
        min-height: 176px;
        padding: 18px;
        border-right: 1px solid #292f38;
        border-bottom: 1px solid #292f38;
      }

      .command-card:nth-child(4n) { border-right: 0; }
      .command-card:nth-last-child(-n + 4) { border-bottom: 0; }

      .command-card-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }

      .command-card code {
        color: #7b8593;
        font-size: 9px;
      }

      .command-card h3 {
        margin: 25px 0 8px;
        font-size: 14px;
      }

      .command-card p {
        margin: 0;
        color: #9098a4;
        font-size: 10px;
        line-height: 1.55;
      }

      .command-board {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 10px;
      }

      .command-lane {
        overflow: hidden;
        border: 1px solid #303744;
        border-radius: 14px;
        background: #101318;
      }

      .command-lane > h3 {
        margin: 0;
        padding: 17px;
        border-bottom: 1px solid #303744;
        font-size: 15px;
      }

      .command-task {
        padding: 15px 17px;
        border-bottom: 1px solid #292f38;
      }

      .command-task:last-child { border-bottom: 0; }
      .command-task code { color: var(--blue); font-size: 8px; }
      .command-task strong { display: block; margin: 5px 0; font-size: 12px; }
      .command-task span { color: #858e9b; font-size: 9px; line-height: 1.45; }

      .command-bottom {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }

      .command-panel {
        padding: 19px;
        border: 1px solid #303744;
        border-radius: 14px;
        background: #101318;
      }

      .command-panel h3 { margin: 0 0 13px; font-size: 15px; }
      .command-list { display: grid; gap: 7px; margin: 0; padding: 0; list-style: none; }
      .command-list li { padding: 10px; border: 1px solid #292f38; border-radius: 8px; color: #949ca8; font-size: 9px; }

      .command-semantic-path {
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        overflow: hidden;
        border: 1px solid #303744;
        border-radius: 14px;
        background: #101318;
      }

      .command-semantic-step { min-height: 112px; padding: 17px; border-right: 1px solid #292f38; }
      .command-semantic-step:last-child { border-right: 0; }
      .command-semantic-step code { color: var(--violet); font-size: 8px; }
      .command-semantic-step strong { display: block; margin-top: 26px; font-size: 12px; }
      .command-source-ledger { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 10px; }

      .source-links { display: grid; gap: 6px; }
      .source-links a { display: block; padding: 9px 10px; border: 1px solid #292f38; border-radius: 7px; color: #aeb6c2; font-size: 9px; line-height: 1.4; text-decoration: none; }
      .source-links a:hover { color: #fff; border-color: #4a5564; }

      .command-enter {
        animation: command-enter 280ms var(--ease-out) both;
      }

      @keyframes command-enter {
        from { opacity: 0; transform: translateY(7px); }
        to { opacity: 1; transform: translateY(0); }
      }

      /* Editorial — narrative, light, deliberate */
      .editorial {
        min-height: 100vh;
        padding-bottom: 120px;
        background: #f2efe8;
        color: #181815;
      }

      .editorial-shell {
        width: min(1260px, calc(100% - 48px));
        margin: 0 auto;
      }

      .editorial-header {
        display: flex;
        min-height: 78px;
        align-items: center;
        justify-content: space-between;
        border-bottom: 1px solid rgba(24, 24, 21, 0.24);
      }

      .editorial-brand {
        font-size: 15px;
        font-weight: 800;
        letter-spacing: -0.02em;
      }

      .editorial-header span:last-child {
        color: #686861;
        font: 10px/1 "SFMono-Regular", Consolas, monospace;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      .editorial-hero {
        display: grid;
        grid-template-columns: minmax(0, 1.42fr) minmax(300px, 0.58fr);
        gap: 70px;
        padding: 92px 0 80px;
        border-bottom: 1px solid rgba(24, 24, 21, 0.25);
      }

      .editorial-hero h1 {
        max-width: 880px;
        margin: 14px 0 25px;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(56px, 7vw, 106px);
        font-weight: 500;
        letter-spacing: -0.065em;
        line-height: 0.9;
      }

      .editorial-hero p {
        max-width: 720px;
        margin: 0;
        color: #55564f;
        font-size: 18px;
        line-height: 1.65;
      }

      .editorial-thesis {
        align-self: end;
        padding-left: 24px;
        border-left: 2px solid #181815;
      }

      .editorial-thesis strong {
        display: block;
        margin-bottom: 10px;
        font-family: Georgia, "Times New Roman", serif;
        font-size: 25px;
        font-weight: 500;
        line-height: 1.2;
      }

      .editorial-thesis span {
        color: #686861;
        font-size: 12px;
        line-height: 1.55;
      }

      .editorial-act {
        display: grid;
        grid-template-columns: 190px minmax(0, 1fr);
        gap: 50px;
        padding: 64px 0;
        border-bottom: 1px solid rgba(24, 24, 21, 0.22);
      }

      .editorial-act-no {
        position: sticky;
        top: 28px;
        align-self: start;
        color: #66665f;
        font: 700 10px/1.4 "SFMono-Regular", Consolas, monospace;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      .editorial-act h2 {
        margin: 0 0 30px;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(36px, 4vw, 62px);
        font-weight: 500;
        letter-spacing: -0.045em;
        line-height: 1;
      }

      .editorial-frontiers {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 1px;
        background: rgba(24, 24, 21, 0.22);
        border: 1px solid rgba(24, 24, 21, 0.22);
      }

      .editorial-frontier {
        min-height: 220px;
        padding: 22px;
        background: #f2efe8;
      }

      .editorial-frontier code { color: #797970; font-size: 9px; }
      .editorial-frontier h3 { margin: 50px 0 10px; font-size: 22px; line-height: 1.15; }
      .editorial-frontier p { margin: 0; color: #5e5f58; font-size: 12px; line-height: 1.6; }

      .editorial-track + .editorial-track { margin-top: 42px; }
      .editorial-track-title { display: grid; grid-template-columns: 1fr auto; gap: 20px; align-items: end; margin-bottom: 12px; }
      .editorial-track-title h3 { margin: 0; font-size: 24px; }
      .editorial-track-title span { color: #66665f; font: 9px/1 "SFMono-Regular", Consolas, monospace; text-transform: uppercase; }

      .editorial-steps {
        border-top: 1px solid #181815;
      }

      .editorial-step {
        display: grid;
        grid-template-columns: 72px 190px minmax(0, 1fr) auto;
        gap: 18px;
        align-items: center;
        min-height: 80px;
        border-bottom: 1px solid rgba(24, 24, 21, 0.2);
      }

      .editorial-step code { color: #66665f; font-size: 9px; }
      .editorial-step strong { font-size: 13px; }
      .editorial-step p { margin: 0; color: #66665f; font-size: 11px; }

      .editorial-plan {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 28px;
      }

      .editorial-plan-column h3 {
        margin: 0 0 14px;
        padding-bottom: 12px;
        border-bottom: 2px solid #181815;
        font-family: Georgia, "Times New Roman", serif;
        font-size: 28px;
        font-weight: 500;
      }

      .editorial-task {
        padding: 17px 0;
        border-bottom: 1px solid rgba(24, 24, 21, 0.2);
      }

      .editorial-task code { color: #74746b; font-size: 8px; }
      .editorial-task strong { display: block; margin: 7px 0; font-size: 13px; }
      .editorial-task p { margin: 0; color: #64645d; font-size: 10px; line-height: 1.55; }

      .editorial-evidence {
        display: grid;
        grid-template-columns: 0.8fr 1.2fr;
        gap: 50px;
      }

      .editorial-checks { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1px; background: rgba(24,24,21,.18); border: 1px solid rgba(24,24,21,.18); }
      .editorial-check { min-height: 120px; padding: 16px; background: #f2efe8; }
      .editorial-check strong { display: block; margin-top: 28px; font-size: 17px; }
      .editorial-check span { color: #696961; font-size: 10px; }
      .editorial-risk { margin: 0; padding-left: 20px; color: #55564f; }
      .editorial-risk li { margin-bottom: 13px; padding-left: 4px; font-size: 11px; line-height: 1.55; }
      .editorial-sources { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 26px; margin-top: 34px; }
      .editorial-source h3 { margin: 0 0 12px; font-family: Georgia, "Times New Roman", serif; font-size: 20px; font-weight: 500; }
      .editorial-source .source-links a { border-color: rgba(24,24,21,.18); color: #55564f; }
      .editorial-source .source-links a:hover { border-color: #181815; color: #181815; }

      .editorial-enter {
        animation: editorial-enter 280ms var(--ease-out) both;
      }

      @keyframes editorial-enter {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }

      /* Navigator — interactive decision surface */
      .navigator {
        min-height: 100vh;
        padding-bottom: 110px;
        background: #0d0f13;
        color: #edf0f4;
      }

      .navigator-header {
        position: sticky;
        top: 0;
        z-index: 20;
        display: flex;
        min-height: 64px;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        padding: 0 22px;
        border-bottom: 1px solid #2c333e;
        background: rgba(13, 15, 19, 0.9);
        backdrop-filter: blur(16px);
      }

      .navigator-header strong { font-size: 13px; }
      .navigator-header span { color: #7f8895; font: 9px/1 "SFMono-Regular", Consolas, monospace; letter-spacing: .08em; text-transform: uppercase; }

      .navigator-layout {
        display: grid;
        grid-template-columns: 245px minmax(0, 1fr);
        width: min(1500px, 100%);
        margin: 0 auto;
      }

      .navigator-rail {
        position: sticky;
        top: 64px;
        height: calc(100vh - 64px);
        padding: 28px 18px 90px;
        border-right: 1px solid #2c333e;
        overflow-y: auto;
      }

      .navigator-rail-label {
        margin: 0 10px 10px;
        color: #697380;
        font: 700 8px/1 "SFMono-Regular", Consolas, monospace;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .navigator-nav {
        display: grid;
        gap: 4px;
        margin-bottom: 24px;
      }

      .navigator-nav button {
        display: grid;
        grid-template-columns: 28px 1fr auto;
        gap: 8px;
        align-items: center;
        min-height: 44px;
        padding: 0 10px;
        border: 1px solid transparent;
        border-radius: 9px;
        background: transparent;
        color: #8e97a3;
        cursor: pointer;
        font: 650 11px/1 inherit;
        text-align: left;
      }

      .navigator-nav button[aria-pressed="true"] {
        border-color: #3b4553;
        background: #181c23;
        color: #edf0f4;
      }

      .navigator-nav button span:first-child { color: #65707d; font: 9px/1 "SFMono-Regular", Consolas, monospace; }
      .navigator-nav button span:last-child { color: #67717e; font: 8px/1 "SFMono-Regular", Consolas, monospace; }

      .navigator-mini {
        padding: 12px;
        border: 1px solid #2d3540;
        border-radius: 10px;
        background: #12151a;
      }

      .navigator-mini strong { display: block; margin-bottom: 7px; font-size: 11px; }
      .navigator-mini p { margin: 0; color: #7f8895; font-size: 9px; line-height: 1.5; }

      .navigator-main {
        min-width: 0;
        padding: 52px 36px 80px;
      }

      .navigator-hero {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 32px;
        align-items: end;
        margin-bottom: 40px;
      }

      .navigator-hero h1 {
        max-width: 840px;
        margin: 12px 0 15px;
        font-size: clamp(42px, 5vw, 72px);
        letter-spacing: -0.06em;
        line-height: 0.96;
      }

      .navigator-hero p { max-width: 720px; margin: 0; color: #929ba7; font-size: 14px; line-height: 1.6; }

      .navigator-snapshot {
        display: grid;
        grid-template-columns: repeat(2, auto);
        gap: 8px;
      }

      .navigator-metric {
        min-width: 0;
        min-width: 112px;
        padding: 12px;
        border: 1px solid #303946;
        border-radius: 10px;
        background: #141820;
      }

      .navigator-metric span { display: block; color: #6f7986; font: 8px/1 "SFMono-Regular", Consolas, monospace; text-transform: uppercase; }
      .navigator-metric strong { display: block; margin-top: 8px; font-size: 13px; overflow-wrap: anywhere; }

      .navigator-panel {
        display: none;
      }

      .navigator-panel[data-active] {
        display: block;
      }

      .navigator-panel-head {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 24px;
        margin-bottom: 14px;
        padding-bottom: 14px;
        border-bottom: 1px solid #343c48;
      }

      .navigator-panel-head h2 { margin: 4px 0 0; font-size: 29px; letter-spacing: -.04em; }
      .navigator-panel-head p { max-width: 570px; margin: 0; color: #808a97; font-size: 10px; text-align: right; }

      .navigator-frontier-grid,
      .navigator-capabilities {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 10px;
      }

      .navigator-card {
        min-height: 200px;
        padding: 18px;
        border: 1px solid #303946;
        border-radius: 12px;
        background: #141820;
      }

      .navigator-card h3 { margin: 42px 0 9px; font-size: 18px; }
      .navigator-card p { margin: 0; color: #8a94a1; font-size: 10px; line-height: 1.55; }

      .navigator-roadmap {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }

      .navigator-track {
        overflow: hidden;
        border: 1px solid #303946;
        border-radius: 12px;
        background: #141820;
      }

      .navigator-track:nth-child(3) { grid-column: 1 / -1; }

      .navigator-track h3 { margin: 0; padding: 16px 18px; border-bottom: 1px solid #303946; font-size: 15px; }
      .navigator-track > p { margin: 0; padding: 13px 18px; border-bottom: 1px solid #303946; color: #808a97; font-size: 9px; line-height: 1.5; }

      .navigator-step {
        display: grid;
        grid-template-columns: 48px minmax(120px, .6fr) minmax(0, 1fr) auto;
        gap: 10px;
        align-items: center;
        min-height: 67px;
        padding: 10px 15px;
        border-bottom: 1px solid #29313b;
      }

      .navigator-step:last-child { border-bottom: 0; }
      .navigator-step code { color: #7f8b99; font-size: 8px; }
      .navigator-step strong { font-size: 10px; }
      .navigator-step p { margin: 0; color: #808a97; font-size: 8px; line-height: 1.45; }

      .navigator-task-list { display: grid; gap: 9px; }
      .navigator-task { display: grid; grid-template-columns: 120px minmax(180px, .7fr) minmax(0, 1fr) auto; gap: 16px; align-items: center; min-height: 76px; padding: 12px 16px; border: 1px solid #303946; border-radius: 11px; background: #141820; }
      .navigator-task code { color: var(--blue); font-size: 8px; }
      .navigator-task strong { font-size: 12px; }

      /* Picker spec — intentionally project-agnostic */
      .proto-picker {
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 2147483647;
        display: flex;
        align-items: center;

  <body>

              </section>
              <section class="command-section command-evidence"><div class="command-bottom">
                <div class="command-panel"><h3>Recorded checks · ${snapshot.date}</h3><ul class="command-list">${checks.map((c) => `<li><strong>${c[0]}</strong> · ${c[1]}</li>`).join("")}<li><strong>Provenance</strong> · ${snapshot.revision} · ${snapshot.commands}</li></ul></div>
                <div class="command-panel"><h3>Known risks</h3><ul class="command-list">${risks.map((r) => `<li>${r}</li>`).join("")}</ul></div>
              </div><div class="command-source-ledger">${sourceGroups.map((group) => `<div class="command-panel"><h3>${group.label}</h3>${sourceLinks(group)}</div>`).join("")}</div></section>
            </div>
          </div>
        </div>`;
      }

      function editorialTrack(track) {
        return `<section class="editorial-track"><div class="editorial-track-title"><h3>${track.label}</h3><span>${track.description}</span></div>
          <div class="editorial-steps">${track.items.map((item) => `<article class="editorial-step"><code>${item[0]}</code><strong>${item[1]}</strong><p>${item[2]}</p>${status(item[3])}</article>`).join("")}</div>
        </section>`;
      }

      function editorialPlan(key, label) {
        return `<section class="editorial-plan-column"><h3>${label}</h3>${plan[key].map((item) => `<article class="editorial-task"><code>${item[0]}</code><strong>${item[1]}</strong><p>${item[2]}</p></article>`).join("")}</section>`;
      }

      function editorialSemantic() {
        return `<section class="editorial-track"><div class="editorial-track-title"><h3>${semanticCore.label}</h3><span>Draft · parallel path</span></div>
          <div class="editorial-steps">${semanticCore.items.map((item) => `<article class="editorial-step"><code>${item[0]}</code><strong>${item[1]}</strong><p>${semanticCore.description}</p>${status(item[2])}</article>`).join("")}</div>
        </section>`;
      }

      function editorialVariant() {
        return `<div class="editorial editorial-enter"><div class="editorial-shell">
          <header class="editorial-header"><div class="editorial-brand">blabase / build record</div><span>Evidence snapshot · ${snapshot.date} · ${snapshot.revision}</span></header>
          <section class="editorial-hero"><div><span class="prototype-note">Execution thesis</span><h1>근거가 버틸 수 있는 만큼만 만든다.</h1><p>blabase의 목적은 기능을 많이 쌓는 것이 아니라, 대화와 작업에서 관찰한 사실을 근거로 검증하고 다음 행동까지 안전하게 연결하는 것입니다.</p></div>
            <aside class="editorial-thesis"><strong>구현 진척과<br>출시 준비도는 다르다.</strong><span>합성 테스트의 녹색과 사람 검토 Golden, 운영 안전성, 배포 승인을 각각 다른 evidence class로 취급합니다.</span></aside>
          </section>
          <section class="editorial-act"><div class="editorial-act-no">Act I<br>Where we are</div><div><h2>세 개의 최전선.</h2><div class="editorial-frontiers">${frontiers.map((f) => `<article class="editorial-frontier"><code>${f.id}</code><h3>${f.title}</h3><p>${f.next}</p></article>`).join("")}</div></div></section>
          <section class="editorial-act"><div class="editorial-act-no">Act II<br>What exists</div><div><h2>현재 구현과 목표 계약을 분리한다.</h2>${editorialTrack(tracks[0])}${editorialSemantic()}${editorialTrack(tracks[1])}</div></section>
          <section class="editorial-act"><div class="editorial-act-no">Act III<br>What comes next</div><div><h2>신뢰 → 완결 → 승인.</h2><div class="editorial-plan">${editorialPlan("now", "NOW")}${editorialPlan("next", "NEXT")}${editorialPlan("gate", "GATE")}</div></div></section>
          <section class="editorial-act"><div class="editorial-act-no">Act IV<br>What evidence says</div><div><h2>통과한 것과 아직 증명하지 않은 것.</h2><div class="editorial-evidence"><div class="editorial-checks">${checks.map((c) => `<div class="editorial-check"><span>${c[0]}</span><strong>${c[1]}</strong></div>`).join("")}</div><ol class="editorial-risk">${risks.map((r) => `<li>${r}</li>`).join("")}<li><strong>Provenance.</strong> ${snapshot.revision} · ${snapshot.commands}</li></ol></div><div class="editorial-sources">${sourceGroups.map((group) => `<section class="editorial-source"><h3>${group.label}</h3>${sourceLinks(group)}</section>`).join("")}</div></div></section>
        </div></div>`;
      }

      function navigatorRoadmapTrack(track) {
        return `<section class="navigator-track"><h3>${track.label}</h3>${track.items.map((item) => `<article class="navigator-step"><code>${item[0]}</code><strong>${item[1]}</strong><p>${item[2]}</p>${status(item[3])}</article>`).join("")}</section>`;
      }

      function navigatorSemantic() {
        return `<section class="navigator-track"><h3>${semanticCore.label}</h3><p>${semanticCore.description}</p>${semanticCore.items.map((item) => `<article class="navigator-step"><code>${item[0]}</code><strong>${item[1]}</strong><p>별도 milestone</p>${status(item[2])}</article>`).join("")}</section>`;
      }

      function navigatorTaskPanel(key, label, description) {
        return `<section class="navigator-panel" data-navigator-panel="${key}"><header class="navigator-panel-head"><div><span class="prototype-note" style="color:var(--green)">Execution lane</span><h2>${label}</h2></div><p>${description}</p></header><div class="navigator-task-list">${plan[key].map((item) => `<article class="navigator-task"><code>${item[0]}</code><strong>${item[1]}</strong><p>${item[2]}</p><span>${item[3]}</span></article>`).join("")}</div></section>`;
      }

      function navigatorVariant() {
        return `<div class="navigator navigator-enter">
          <header class="navigator-header"><strong>blabase · Execution Navigator</strong><span>Purpose unchanged · decision flow redesigned</span></header>
          <div class="navigator-layout">
            <aside class="navigator-rail"><div><p class="navigator-rail-label">Read</p><nav class="navigator-nav" aria-label="Navigator sections">
              <button class="pressable" data-navigator-tab="overview" aria-pressed="true"><span>01</span>Overview<span>3</span></button>
              <button class="pressable" data-navigator-tab="roadmap" aria-pressed="false"><span>02</span>Roadmap<span>21</span></button>
              <button class="pressable" data-navigator-tab="now" aria-pressed="false"><span>03</span>NOW<span>4</span></button>
              <button class="pressable" data-navigator-tab="next" aria-pressed="false"><span>04</span>NEXT<span>5</span></button>
              <button class="pressable" data-navigator-tab="gate" aria-pressed="false"><span>05</span>GATE<span>4</span></button>
              <button class="pressable" data-navigator-tab="sources" aria-pressed="false"><span>06</span>Sources<span>4</span></button>
              <button class="pressable" data-navigator-tab="evidence" aria-pressed="false"><span>07</span>Evidence<span>11</span></button>
            </nav><p class="navigator-rail-label">Boundary</p><div class="navigator-mini"><strong>Static snapshot</strong><p>${snapshot.date} · ${snapshot.revision}. 코드·테스트·계획 문서를 대조. 실시간 telemetry나 release approval이 아닙니다.</p></div></div></aside>
            <main class="navigator-main"><section class="navigator-hero"><div><span class="prototype-note" style="color:var(--green)">Decision-oriented dashboard</span><h1>현재 위치에서<br>다음 게이트까지.</h1><p>같은 목적과 정보를 탐색 가능한 실행 지도로 재구성했습니다. 왼쪽에서 읽을 질문을 선택하면 필요한 정보만 즉시 바뀝니다.</p></div><div class="navigator-snapshot">${checks.map((c) => `<div class="navigator-metric"><span>${c[0]}</span><strong>${c[1]}</strong></div>`).join("")}</div></section>
              <section class="navigator-panel" data-navigator-panel="overview" data-active><header class="navigator-panel-head"><div><span class="prototype-note" style="color:var(--green)">Current frontier</span><h2>지금 알아야 할 세 가지</h2></div><p>단일 완료율 대신 제품 트랙별 최전선과 다음 증거 게이트를 봅니다.</p></header><div class="navigator-frontier-grid">${frontiers.map((f) => `<article class="navigator-card">${status(f.status)}<h3>${f.title}</h3><p>${f.next}</p></article>`).join("")}</div></section>
              <section class="navigator-panel" data-navigator-panel="roadmap"><header class="navigator-panel-head"><div><span class="prototype-note" style="color:var(--green)">Implementation map</span><h2>두 구현 트랙과 하나의 목표 계약</h2></div><p>현재 12-Type 대화 런타임, Draft 7-Type 목표 계약, 별도 Observation + Action Layer를 섞지 않습니다.</p></header><div class="navigator-roadmap">${navigatorRoadmapTrack(tracks[0])}${navigatorRoadmapTrack(tracks[1])}${navigatorSemantic()}</div></section>
              ${navigatorTaskPanel("now", "NOW · Trust first", "Sprint 5C와 fixture coverage, release evidence package, launcher beta 경계를 먼저 고정합니다.")}
              ${navigatorTaskPanel("next", "NEXT · Close the loop", "canonical result·영속성·source actionability·운영 ownership을 연결합니다.")}
              ${navigatorTaskPanel("gate", "GATE · Decision, not code", "사람 검토와 frozen input, 배포 시스템이 release 또는 rollback을 승인합니다.")}
              <section class="navigator-panel" data-navigator-panel="sources"><header class="navigator-panel-head"><div><span class="prototype-note" style="color:var(--green)">Source capability</span><h2>연결됨과 판단 가능함은 다르다</h2></div><p>관찰 가능한 데이터를 바로 추천 후보로 승격하지 않는 것이 핵심 안전 계약입니다.</p></header><div class="navigator-capabilities">${capabilities.map((c) => `<article class="navigator-capability"><code>${c[1]}</code><h3>${c[0]}</h3><p>${c[2]}</p></article>`).join("")}</div></section>
              <section class="navigator-panel" data-navigator-panel="evidence"><header class="navigator-panel-head"><div><span class="prototype-note" style="color:var(--green)">Evidence boundary</span><h2>통과와 미검증을 함께 표시</h2></div><p>회귀 계약의 녹색은 제품 품질이나 외부 출시 승인이 아닙니다.</p></header><div class="navigator-evidence"><div class="navigator-box"><h3>Recorded checks · ${snapshot.date}</h3><ul>${checks.map((c) => `<li><strong>${c[0]}</strong> · ${c[1]}</li>`).join("")}<li><strong>Provenance</strong> · ${snapshot.revision} · ${snapshot.commands}</li></ul></div><div class="navigator-box"><h3>Known risks</h3><ul>${risks.map((r) => `<li>${r}</li>`).join("")}</ul></div></div><div class="navigator-sources">${sourceGroups.map((group) => `<div class="navigator-box"><h3>${group.label}</h3>${sourceLinks(group)}</div>`).join("")}</div></section>
            </main>
          </div>
        </div>`;
      }

      const variants = [commandVariant, editorialVariant, navigatorVariant];
      const stage = document.getElementById('stage');
      const picker = document.querySelector('.proto-picker');
      const highlight = picker.querySelector('.proto-picker-highlight');
      const items = [...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')];
      const replay = picker.querySelector('.proto-picker-replay');
      let current = 0;

      function moveHighlight() {
        const el = items[current];
        highlight.style.width = el.offsetWidth + 'px';
        highlight.style.transform = `translateX(${el.offsetLeft}px)`;
      }

      function mount(i) {
        stage.innerHTML = '';
        requestAnimationFrame(() => { stage.innerHTML = variants[i](); });
      }

      function setActive(i) {
        if (i < 0 || i >= variants.length) return;
        current = i;
        items.forEach((el, j) => {
          el.toggleAttribute('data-active', j === i);
          if (j === i) el.setAttribute('aria-current', 'true');
          else el.removeAttribute('aria-current');
        });
        moveHighlight();
        const url = new URL(location);
        url.searchParams.set('v', i + 1);
        history.replaceState(null, '', url);
        mount(i);
      }

      items.forEach((el, i) => el.addEventListener('click', () => setActive(i)));
      replay?.addEventListener('click', () => mount(current));
      window.addEventListener('resize', moveHighlight);

      document.addEventListener('keydown', (e) => {
        if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
        if (e.metaKey || e.ctrlKey || e.altKey) return;
        const num = parseInt(e.key, 10);
        if (num >= 1 && num <= variants.length) setActive(num - 1);
        else if (e.key === 'ArrowRight') setActive((current + 1) % variants.length);
        else if (e.key === 'ArrowLeft') setActive((current - 1 + variants.length) % variants.length);
        else if (e.key === 'r' || e.key === 'R') mount(current);
      });

      stage.addEventListener("click", (event) => {
        const commandButton = event.target.closest("[data-command-filter]");
        if (commandButton) {
          const filter = commandButton.dataset.commandFilter;
          stage.querySelectorAll("[data-command-filter]").forEach((button) => {
            button.setAttribute("aria-pressed", String(button === commandButton));
          });
          stage.querySelectorAll("[data-command-track]").forEach((element) => {
            element.hidden = filter !== "all" && element.dataset.commandTrack !== filter;
          });
          stage.querySelector(".command-plan").hidden = filter !== "all" && filter !== "release";
          stage.querySelector(".command-evidence").hidden = filter !== "all" && filter !== "release";
          stage.querySelectorAll("[data-command-frontier]").forEach((element) => {
            element.hidden = filter !== "all" && element.dataset.commandFrontier !== filter;
          });
        }

        const navigatorButton = event.target.closest("[data-navigator-tab]");
        if (navigatorButton) {
          const panel = navigatorButton.dataset.navigatorTab;
          stage.querySelectorAll("[data-navigator-tab]").forEach((button) => {
            button.setAttribute("aria-pressed", String(button === navigatorButton));
          });
          stage.querySelectorAll("[data-navigator-panel]").forEach((element) => {
            element.toggleAttribute("data-active", element.dataset.navigatorPanel === panel);
          });
        }
      });

      setActive((parseInt(new URLSearchParams(location.search).get('v'), 10) || 1) - 1);
      requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute('data-ready', '')));
    </script>
  </body>
</html>
