<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Biadone Edu</title>
  <link rel="stylesheet" href="../shared/common.css">
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="slide-page">
  <main class="edu-slide" aria-labelledby="edu-title">
    <div class="edu-top">
      <header class="edu-header">
        <span data-brand-logo="inverse"></span>
        <p class="edu-label" data-copy="edu.label"></p>
      </header>
      <div class="edu-intro">
        <h1 id="edu-title" data-copy="edu.title"></h1>
        <p class="edu-description" data-copy="edu.description"></p>
      </div>
    </div>

    <div class="edu-stages">
      <section class="edu-stage edu-stage--one" aria-labelledby="stage-one-title">
        <h2 id="stage-one-title" data-copy="edu.oneTitle"></h2>
        <p data-copy="edu.oneDescription"></p>
      </section>
      <section class="edu-stage edu-stage--two" aria-labelledby="stage-two-title">
        <h2 id="stage-two-title" data-copy="edu.twoTitle"></h2>
        <p data-copy="edu.twoDescription"></p>
      </section>
      <section class="edu-stage edu-stage--three" aria-labelledby="stage-three-title">
        <h2 id="stage-three-title" data-copy="edu.threeTitle"></h2>
        <p data-copy="edu.threeDescription"></p>
      </section>
    </div>

    <footer class="edu-footer" data-copy="edu.footer"></footer>
  </main>
  <script src="../shared/content.js" defer></script>
</body>
</html>
