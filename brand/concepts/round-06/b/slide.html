<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Biadone Edu — 부드러운 연결</title>
  <link rel="stylesheet" href="../shared/common.css">
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="slide-page">
  <main class="slide-canvas" aria-labelledby="edu-title">
    <header class="slide-header">
      <span data-brand-logo></span>
      <p data-copy="edu.label"></p>
    </header>

    <div class="slide-introduction">
      <h1 id="edu-title" data-copy="edu.title"></h1>
      <p data-copy="edu.description"></p>
    </div>

    <section class="teaching-field" aria-label="자동화 학습의 세 단계">
      <svg class="teaching-geometry" viewBox="0 0 1456 350" aria-hidden="true">
        <path class="connection-ribbon" d="M146 114 C360 114 404 64 660 64 C916 64 974 114 1200 114"></path>
        <path class="connection-line" d="M146 114 C360 114 404 64 660 64 C916 64 974 114 1200 114"></path>
        <g class="connection-points">
          <circle cx="146" cy="114" r="10"></circle>
          <circle cx="660" cy="64" r="10"></circle>
          <circle cx="1200" cy="114" r="10"></circle>
        </g>
      </svg>
      <article class="teaching-stage teaching-stage-one">
        <h2 data-copy="edu.oneTitle"></h2>
        <p data-copy="edu.oneDescription"></p>
      </article>
      <article class="teaching-stage teaching-stage-two">
        <h2 data-copy="edu.twoTitle"></h2>
        <p data-copy="edu.twoDescription"></p>
      </article>
      <article class="teaching-stage teaching-stage-three">
        <h2 data-copy="edu.threeTitle"></h2>
        <p data-copy="edu.threeDescription"></p>
      </article>
    </section>

    <footer class="slide-footer" data-copy="edu.footer"></footer>
  </main>
  <script src="../shared/content.js" defer></script>
</body>
</html>
