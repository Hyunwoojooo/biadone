<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Biadone Edu</title>
  <link rel="stylesheet" href="../shared/common.css">
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="slide-page">
  <main class="edu-slide" aria-labelledby="edu-title">
    <header class="slide-header">
      <span data-brand-logo></span>
      <p data-copy="edu.label"></p>
    </header>

    <div class="slide-heading">
      <h1 id="edu-title" data-copy="edu.title"></h1>
      <p class="slide-description" data-copy="edu.description"></p>
    </div>

    <ol class="edu-flow">
      <li class="flow-step">
        <span class="flow-node" aria-hidden="true"></span>
        <h2 data-copy="edu.oneTitle"></h2>
        <p data-copy="edu.oneDescription"></p>
      </li>
      <li class="flow-step">
        <span class="flow-node" aria-hidden="true"></span>
        <h2 data-copy="edu.twoTitle"></h2>
        <p data-copy="edu.twoDescription"></p>
      </li>
      <li class="flow-step">
        <span class="flow-node" aria-hidden="true"></span>
        <h2 data-copy="edu.threeTitle"></h2>
        <p data-copy="edu.threeDescription"></p>
      </li>
    </ol>

    <footer class="slide-footer" data-copy="edu.footer"></footer>
  </main>
  <script src="../shared/content.js" defer></script>
</body>
</html>
