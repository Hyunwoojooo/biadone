<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="나를 이해하고 함께 일하는 AI를 향한 Biadone의 비전과 프로젝트를 소개합니다.">
  <title>Biadone</title>
  <link rel="stylesheet" href="../../biadone.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="biadone-theme company-page">
  <header class="biadone-site-header biadone-page">
    <a href="#vision" aria-label="Biadone 비전으로 이동">
      <span class="biadone-logo" role="img" aria-label="Biadone">
        <span class="biadone-logo__symbol"><img src="../../assets/logo/biadone-symbol.svg" width="64" height="64" alt=""></span>
        <span class="biadone-logo__name" aria-hidden="true">Biadone</span>
      </span>
    </a>
    <nav class="biadone-nav" aria-label="주요 메뉴">
      <a href="#vision">비전</a>
      <a href="#projects">프로젝트</a>
      <a href="#edu">Biadone Edu</a>
    </nav>
  </header>

  <main>
    <!-- 편집: 비전 제목, 소개 문장, 페이지 안의 실제 이동 목적지. -->
    <section class="biadone-page company-hero" id="vision" aria-labelledby="vision-title">
      <h1 class="biadone-title" id="vision-title">하고 싶은 일을,<br>더 많이 해낼 수 있도록.</h1>
      <div class="company-support">
        <p class="biadone-lead company-description">나를 이해하고 함께 일하는 AI를 만듭니다.<br>
          Biadone은 서비스와 교육을 통해 그 여정을 이어갑니다.</p>
        <div class="company-actions">
          <a class="biadone-button" href="#projects">프로젝트 보기</a>
          <a class="biadone-link" href="#edu">Biadone Edu</a>
        </div>
      </div>

      <ol class="biadone-flow company-flow" aria-label="Biadone이 지향하는 AI의 흐름">
        <li><span class="biadone-flow-marker" aria-hidden="true"></span><p>나를 이해하고</p></li>
        <li><span class="biadone-flow-marker" aria-hidden="true"></span><p>함께 실행하고</p></li>
        <li><span class="biadone-flow-marker" aria-hidden="true"></span><p>일을 완성하다</p></li>
      </ol>
    </section>

    <!-- 편집: 실제 프로젝트 소개와 현재 상태. 확인되지 않은 성과는 추가하지 않습니다. -->
    <section class="biadone-page biadone-section company-projects" id="projects" aria-labelledby="projects-title">
      <h2 class="biadone-section-title" id="projects-title">생각을 실행으로 옮기는 여정</h2>
      <div class="company-project-list">
        <article class="company-project" aria-labelledby="blabee-title">
          <h3 class="biadone-subtitle" id="blabee-title">Blabee</h3>
          <p class="biadone-body company-project-description">나와 함께 일하는 AI를 향한 첫 번째 프로젝트.</p>
        </article>
        <article class="company-project" id="edu" aria-labelledby="edu-title">
          <h3 class="biadone-subtitle" id="edu-title">Biadone Edu</h3>
          <p class="biadone-body company-project-description">AI·AX·자동화를 배우고, 나의 일에 적용하는 교육을 준비합니다.</p>
          <p class="biadone-source company-project-status">준비 중</p>
        </article>
      </div>
    </section>
  </main>

  <footer class="biadone-page company-footer">
    <p class="biadone-source">Biadone</p>
    <span class="biadone-signature" aria-hidden="true"><span></span><span></span></span>
  </footer>
</body>
</html>
